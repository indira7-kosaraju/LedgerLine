# Render Blueprint for the LedgerLine API (backend only).
# Render → New → Blueprint → select this repository. Secrets marked `sync: false`
# are entered in the Render dashboard – never committed.
services:
  - type: web
    name: ledgerline-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # --include=dev: the Prisma CLI is a devDependency but is needed at build time
    # (postinstall → prisma generate) and at start (prisma migrate deploy).
    # With NODE_ENV=production, plain `npm ci` would skip it and the build would fail.
    buildCommand: npm ci --include=dev
    # Apply pending migrations, then start. `migrate deploy` only applies committed
    # migration files – it never resets or drops data.
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Neon connection string (direct, not pooled) – entered in the dashboard
        sync: false
      - key: JWT_SECRET # generated by Render: long and random
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: CORS_ORIGIN # the Vercel URL, e.g. https://ledgerline.vercel.app – entered in the dashboard
        sync: false
      # Requests pass through 2 proxies: Vercel (rewrite) and Render's load balancer.
      - key: TRUST_PROXY
        value: "2"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_MAX
        value: "600"
