# Render Blueprint for the LedgerLine API (backend only).
# Render → New → Blueprint → select this repository. Secrets marked `sync: false`
# are entered in the Render dashboard – never committed.
services:
  - type: web
    name: ledgerline-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # --include=dev: the Prisma CLI is a devDependency but is needed at build time
    # (postinstall → prisma generate). With NODE_ENV=production, plain `npm ci` would skip it.
    buildCommand: npm ci --include=dev
    # The server does NOT migrate: it only has the limited API role, never the table owner's
    # credentials. Migrations run from your computer first: npm run db:prepare:production
    # (docs/DEPLOYMENT.md). If a migration is missing, /api/health/ready reports "schema": "failed".
    startCommand: npm start
    # Readiness: database, Redis, ledger triggers/constraints and the limited database role must all be OK,
    # otherwise a new deploy never goes live and Render keeps the previous version running.
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The API role ledgerline_api on Neon's POOLED host, entered in the dashboard:
      # postgresql://ledgerline_api:<password>@ep-…-pooler.….neon.tech/neondb?sslmode=require&pgbouncer=true&connection_limit=5
      # Never the owner (neondb_owner) – and DIRECT_DATABASE_URL is deliberately NOT set here.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET # generated by Render: long and random
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: CORS_ORIGIN # the Vercel URL (this deployment: https://ledger-line-umber.vercel.app) – entered in the dashboard
        sync: false
      # Requests pass through 2 proxies: Vercel (rewrite) and Render's load balancer.
      - key: TRUST_PROXY
        value: "2"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_MAX
        value: "600"
      # Rate-limit counters (required in production – without it the server refuses to start).
      # The INTERNAL URL of a Render Key Value instance in the same region, entered in the dashboard:
      # redis://red-…:6379 (reachable only from Render services, not from the internet).
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: "ll:prod:"
      - key: AUTH_ACCOUNT_FAILURE_LIMIT # failed logins per account (email) per 15 minutes
        value: "10"
